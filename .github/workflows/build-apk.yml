name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [pl-projek, jaga-anak]
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak ZIP
        run: |
          mkdir -p "work/${{ matrix.app }}"
          unzip -q "${{ matrix.app }}.zip" -d "work/${{ matrix.app }}"
          SETTINGS=$(find "work/${{ matrix.app }}" -maxdepth 6 \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle / settings.gradle.kts tidak ditemukan di ZIP"; exit 1; fi
          echo "ROOT=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Siapkan Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Beri izin gradlew
        run: |
          if [ -f "$ROOT/gradlew" ]; then chmod +x "$ROOT/gradlew"; fi
      - name: Build APK
        id: build_apk
        run: |
          set -o pipefail
          cd "$ROOT"
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          else
            gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          fi
      - name: Ringkasan diagnosis build
        if: failure()
        run: |
          {
            echo '## Diagnosis build APK'
            echo ''
            if [ -f build.log ]; then
              echo 'Cuplikan baris error dari build.log:'
              echo '```text'
              grep -inE -B 3 -A 5 'error:|What went wrong|FAILURE:|Could not|Execution failed|A problem occurred|Unresolved reference|e: ' build.log | tail -n 100 || tail -n 100 build.log
              echo '```'
            else
              echo 'build.log belum dibuat. Kegagalan kemungkinan terjadi sebelum perintah Gradle dijalankan (misalnya ekstraksi ZIP atau persiapan SDK). Buka log langkah yang gagal.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Unggah log diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-diagnostics
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Ambil APK
        run: cp "$ROOT/app/build/outputs/apk/debug/app-debug.apk" "${{ matrix.app }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}
          path: ${{ matrix.app }}.apk
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true
      - name: Buat release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "apk-${{ github.run_number }}" apks/*.apk --repo "${{ github.repository }}" --title "APK build ${{ github.run_number }}" --notes "pl-projek.apk dan jaga-anak.apk"
